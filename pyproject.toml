[project]
name = "bayesian-change-detection"
version = "0.1.0"
description = "Bayesian change detection for input-output sequence data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "matplotlib>=3.10.0",
    "numpy>=2.2.2",
    "scipy>=1.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9.2",
]


[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "NPY"]
ignore = [
    "NPY002", # Replace legacy `np.random.randn` call with `np.random.Generator`
]
