[project]
name = "bayesian-change-detection"
version = "0.1.0"
description = "Bayesian change detection for input-output sequence data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "matplotlib>=3.10.0",
    "numpy>=1.26.4",
    "scipy>=1.15.1",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.2",
]


[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "NPY", "RUF", "T10"]
ignore = [
    "NPY002", # Replace legacy `np.random.randn` call with `np.random.Generator`
]

[[tool.mypy.overrides]]
module = "scipy"
ignore_missing_imports = true
