name: CI
on:
  push:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
  test:
    needs: [pre-commit]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resolution: ["locked", "lowest-direct", "highest"]
        python-version: ["3.12"]
    name: "Test / Python ${{ matrix.python-version }} / ${{ matrix.resolution }} dependencies"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.16"
          enable-cache: false
      - name: Resolve ${{ matrix.resolution }} Python dependencies
        if: matrix.resolution != 'locked'
        run: |
          uv lock --resolution ${{ matrix.resolution }}
          echo "UV_RESOLUTION=${{ matrix.resolution }}" >> $GITHUB_ENV
      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: "uv-py${{ matrix.python-version }}-${{ matrix.resolution }}-${{ runner.os }}-${{ hashFiles('uv.lock') }}"
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Python type checking
        run: uv run --frozen mypy .
      - name: Run tests
        run: uv run --frozen pytest -vvv
      - name: Minimise uv cache
        run: uv cache prune --ci
